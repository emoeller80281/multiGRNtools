name: celloracle_env
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - pip

  # R
  - r-base=4.3
  - r-biocmanager
  - r-matrix
  - r-irlba
  - r-monocle3

  # Bioconductor
  - bioconductor-cicero
  - bioconductor-biobase
  - bioconductor-genomeinfodbdata
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - bioconductor-delayedarray
  - bioconductor-genomicranges
  - bioconductor-iranges
  - bioconductor-s4vectors

  - numpy=1.26
  - pandas=1.5
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - h5py
  - pyarrow
  - pybedtools
  - pysam
  - scanpy
  - anndata
  - cython

  - pip:
      - celloracle==0.20.0
      - genomepy==0.16.3
      - gimmemotifs==0.17.2
      - goatools==1.6.4
      - velocyto==0.17.17
      - logomaker==0.8.7
      - qnorm==0.9.0
